{#- Ô mật khẩu kèm nút con mắt bật/tắt hiện chữ (JS ở base.html: [data-password-toggle]). -#}
{% macro password_input(name="password", autocomplete="current-password", placeholder="Nhập mật khẩu", minlength=None) -%}
<span class="password-field">
  <input type="password" name="{{ name }}" required{% if minlength %} minlength="{{ minlength }}"{% endif %} placeholder="{{ placeholder }}" autocomplete="{{ autocomplete }}" spellcheck="false">
  <button type="button" class="password-toggle" data-password-toggle aria-pressed="false" aria-label="Hiện mật khẩu" title="Hiện mật khẩu">
    <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7c2.1 0 3.9.7 5.4 1.7M22 12s-3.6 7-10 7c-2.1 0-3.9-.7-5.4-1.7"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg>
  </button>
</span>
{%- endmacro %}
