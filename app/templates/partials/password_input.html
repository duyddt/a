{#- Ô mật khẩu kèm nút con mắt bật/tắt hiện chữ (static/shell.js: [data-password-toggle]). -#}
{% from "partials/icon.html" import icon %}
{% macro password_input(name="password", autocomplete="current-password", placeholder="Nhập mật khẩu", minlength=None, id=None) -%}
<span class="password-field">
  <input type="password" name="{{ name }}"{% if id %} id="{{ id }}"{% endif %} required{% if minlength %} minlength="{{ minlength }}"{% endif %} placeholder="{{ placeholder }}" autocomplete="{{ autocomplete }}" spellcheck="false">
  <button type="button" class="password-toggle" data-password-toggle aria-pressed="false" aria-label="Hiện mật khẩu" title="Hiện mật khẩu">
    {{ icon("eye") }}{{ icon("eye-off") }}
  </button>
</span>
{%- endmacro %}
